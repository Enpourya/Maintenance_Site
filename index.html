<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-config="site_name">در حال بروزرسانی - گالری اوپال</title>
    
    <!-- امنیت: جلوگیری از ایندکس شدن توسط موتورهای جستجو -->
    <meta name="robots" content="noindex, nofollow">
    
    <!-- امنیت: جلوگیری از کش شدن صفحه -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    
    <!-- امنیت: Content Security Policy -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data: https:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; connect-src 'self' https:;">
    
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <main class="maintenance-container">
        <!-- لوگو -->
        <div class="logo-container">
            <img src="icon/logo.png" alt="لوگوی سایت" class="logo" id="siteLogo">
        </div>
        
        <!-- عنوان دو خطی -->
        <div class="title-container">
            <h1 class="site-name" data-config="site_name">گالری اوپال</h1>
            <h2 class="maintenance-text" data-config="maintenance_text">سایت در حال بروزرسانی می‌باشد</h2>
        </div>
        
        <!-- شبکه‌های اجتماعی -->
        <div class="social-links" id="socialLinks">
            <!-- لینک‌ها با جاوااسکریپت اضافه می‌شوند -->
        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
